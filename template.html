<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Kinerja Artikel &amp; Strategi Konten</title>
<style>
:root{
  --bg:#0b1120; --panel:#111c33; --panel2:#16233d; --line:#22304d;
  --txt:#e6edf7; --dim:#8fa3c0; --acc:#38bdf8; --ok:#34d399; --warn:#fbbf24;
  --bad:#f87171; --pur:#a78bfa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
header{padding:18px 22px 0;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:19px;letter-spacing:-.2px}
.sub{color:var(--dim);font-size:12px;margin:4px 0 14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:9px 14px;border:1px solid var(--line);border-bottom:none;
  border-radius:8px 8px 0 0;background:var(--panel2);color:var(--dim);cursor:pointer;font-size:13px}
.tab.on{background:var(--bg);color:var(--txt);border-color:var(--acc)}
main{padding:18px 22px 60px}
.grid{display:grid;gap:12px}
.kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.card .val{font-size:26px;font-weight:600;margin-top:6px}
.card .note{color:var(--dim);font-size:11px;margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--panel2);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;white-space:nowrap}
.p-ok{background:rgba(52,211,153,.15);color:var(--ok)}
.p-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.p-bad{background:rgba(248,113,113,.15);color:var(--bad)}
.p-dim{background:rgba(143,163,192,.15);color:var(--dim)}
.p-acc{background:rgba(56,189,248,.15);color:var(--acc)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
.scroll{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.muted{color:var(--dim)}
.small{font-size:12px}
h2{font-size:15px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.rec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rec.hi{border-left-color:var(--bad)}
.rec.mid{border-left-color:var(--warn)}
.rec h3{margin:0 0 6px;font-size:14px}
.rec .row{margin:4px 0;font-size:13px}
.rec .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
pre{background:#0a1526;border:1px solid var(--line);border-radius:7px;padding:10px;
  overflow:auto;font-size:12px;max-height:220px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.spark{display:block}
.btn-copy{font-size:11px;padding:4px 9px}
.grid.k3{grid-template-columns:repeat(3,1fr)}
.grid.sites{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card.site .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.site .v{font-size:17px;font-weight:600;margin-top:2px}
.btn-go{font-size:12px;padding:5px 10px;width:100%}
.ok{color:var(--ok)}
tr.meta-saran td{background:var(--panel2);border-bottom:1px solid var(--line);padding-top:4px;padding-bottom:8px}
tr.meta-saran div{margin:2px 0}
tr.meta-saran td{white-space:normal}
.pill{white-space:normal}
</style>
</head>
<body>
<header>
  <h1>Dashboard Kinerja Artikel &amp; Strategi Konten</h1>
  <div class="sub" id="stamp">memuat…</div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="view"></main>

<script>
/* ===== data (di-inject oleh build.py; bisa di-refresh via fetch) ===== */
const ARTICLES = /*__ARTICLES__*/[];
const BRANDS   = /*__BRANDS__*/[];
const GSC      = /*__GSC__*/{};
const AUDIT    = /*__AUDIT__*/[];   // hasil audit_unindexed.py (status HTTP/noindex/sitemap)
const META = /*__META__*/{};
const META_AUDIT = /*__META_AUDIT__*/{};
const SITES    = /*__SITES__*/[];          // 17 website dari sheet portofolio
const SITES_STATUS = /*__SITES_STATUS__*/[]; // DNS/HTTP/sitemap/GSC per website
const DOMAIN_PERF  = /*__DOMAIN_PERF__*/{};  // agregat GSC per domain (semua URL)
const PORTFOLIO = /*__PORTFOLIO__*/[];       // 1 baris per domain: kertas kerja + status + GSC

const TODAY = new Date().toISOString().slice(0,10);
const CUR_KEY = TODAY.slice(0,7);            // "2026-09"
const MONTH_ORDER = ["January","February","March","April","May","June","July",
                     "August","September","October","November","December"];
const fmt = n => (n==null?'—':Number(n).toLocaleString('id-ID'));
const dec = (n,d=2) => (n==null||n===''?'—':Number(n).toLocaleString('id-ID',
  {minimumFractionDigits:d, maximumFractionDigits:d}));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b) => b ? Math.round(100*a/b) : 0;

/* ===== turunan ===== */
function status(a){
  if (a.live_url) return 'Posted';
  if (a.deadline_posting && a.deadline_posting < TODAY) return 'Overdue';
  if (a.draft_url) return 'Draft';
  return 'Belum mulai';
}
function normUrl(u){
  if (!u) return '';
  let s = String(u).trim().toLowerCase();
  s = s.replace(/^http:/, 'https:');
  try { const x = new URL(s); s = x.origin + x.pathname.replace(/\/+$/, '') + (x.search||''); }
  catch(e) { s = s.replace(/\/+$/, ''); }
  return s;
}
const GSC_N = {};   // dibangun ulang tiap data dimuat
function rebuildGscIndex(){
  Object.keys(GSC_N).forEach(k=>delete GSC_N[k]);
  for (const u of Object.keys(GSC)) GSC_N[normUrl(u)] = GSC[u];
}
function metrics(a){ return GSC_N[normUrl(a.live_url)] || null; }
function monthKey(m){ if(!m) return '0000-00'; const [n,y]=m.split(' '); return y+'-'+String(MONTH_ORDER.indexOf(n)+1).padStart(2,'0'); }

const CLIENTS = [...new Set(ARTICLES.map(a=>a.client).filter(Boolean))].sort();
const MONTHS  = [...new Set(ARTICLES.map(a=>a.month).filter(Boolean))]
                .sort((a,b)=>monthKey(a).localeCompare(monthKey(b)));

function agg(list){
  const o = {n:list.length, posted:0, overdue:0, draft:0, kw:0, cta:0, outline:0,
             impr:0, clicks:0, rankSum:0, rankN:0, withGsc:0, top3:0, page1:0, page2:0, page3:0};
  for (const a of list){
    const s = status(a);
    if (s==='Posted') o.posted++; else if (s==='Overdue') o.overdue++; else if (s==='Draft') o.draft++;
    if (a.keyword) o.kw++;
    if (/^https?:/.test(a.produk||'')) o.cta++;
    if ((a.outline||'').length>40) o.outline++;
    const m = metrics(a);
    if (m){ o.withGsc++; o.impr+=m.impr||0; o.clicks+=m.clicks||0;
            if (m.pos){ o.rankSum+=m.pos; o.rankN++;
              if (m.pos<=3) o.top3++; else if (m.pos<=10) o.page1++;
              else if (m.pos<=20) o.page2++; else o.page3++; } }
  }
  o.ctr = o.impr ? +(100*o.clicks/o.impr).toFixed(2) : 0;
  o.rank = o.rankN ? +(o.rankSum/o.rankN).toFixed(1) : 0;
  return o;
}

/* ===== render helpers ===== */
function kpi(lbl,val,note,barPct){
  return `<div class="card"><div class="lbl">${lbl}</div><div class="val">${val}</div>
    ${note?`<div class="note">${note}</div>`:''}
    ${barPct!=null?`<div class="bar"><i style="width:${barPct}%"></i></div>`:''}</div>`;
}
function bars(data,{w=560,h=150,color='var(--acc)'}={}){
  const max = Math.max(1,...data.map(d=>d.v));
  const bw = w/data.length;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${
    data.map((d,i)=>{
      const bh = Math.round((h-44)*d.v/max);
      const yTop = h-22-bh;
      return `<rect x="${i*bw+6}" y="${yTop}" width="${bw-12}" height="${bh}" rx="3" fill="${color}"/>
        <text x="${i*bw+bw/2}" y="${h-8}" fill="#8fa3c0" font-size="10" text-anchor="middle">${esc(d.l)}</text>
        <text x="${i*bw+bw/2}" y="${Math.max(12,yTop-5)}" fill="#e6edf7" font-size="10" text-anchor="middle">${d.v}</text>`;
    }).join('')}</svg>`;
}
function spark(weeks,key,color){
  const v = weeks.map(w=>w[key]||0); const max=Math.max(1,...v);
  const pts = v.map((x,i)=>`${i*(100/(v.length-1||1))},${28-26*x/max}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 30" width="90" height="26" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function posBuckets(list){
  const b = {'Top 3':0, 'Halaman 1 (4-10)':0, 'Halaman 2 (11-20)':0, 'Halaman 3+ (>20)':0};
  for (const a of (list||ARTICLES)){
    const m = metrics(a); if (!m) continue;
    const p = m.pos||0; if (!p) continue;
    if (p<=3) b['Top 3']++; else if (p<=10) b['Halaman 1 (4-10)']++;
    else if (p<=20) b['Halaman 2 (11-20)']++; else b['Halaman 3+ (>20)']++;
  }
  return b;
}
function downloadCsv(name, cols, rows){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv = '\ufeff' + [cols.map(q).join(',')].concat(
    rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function table(cols,rows,sortKey){
  return `<div class="scroll"><table><thead><tr>${
    cols.map(c=>`<th data-k="${c.k}"${c.w?` style="width:${c.w}"`:''}>${c.t}</th>`).join('')
  }</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ===== tabs ===== */
const TABS = [
  ['portfolio','🏠 Portofolio'],
  ['site','🌐 Performa Website'],
  ['rekomendasi','🎯 Rekomendasi'],
  ['overview','📊 Ringkasan'],
  ['pipeline','🏭 Pipeline Produksi'],
  ['performa','📈 Performa Artikel'],
  ['keyword','🔑 Keyword & Kanibalisasi'],
  ['banding','🔁 Banding Periode'],
  ['meta','✍️ Perbaikan Meta'],
  ['strategi','🎯 Strategi Konten'],
  ['aksi','🛠️ Aksi & Perbaikan'],
];
let cur = (location.hash || '').replace('#', '') || 'portfolio';
if (!TABS.some(t => t[0] === cur)) cur = 'portfolio';

const F = {month:'', client:'', status:'', q:'', site:''};

function render(){
  document.getElementById('tabs').innerHTML = TABS.map(([k,t])=>
    `<div class="tab${k===cur?' on':''}" data-tab="${k}">${t}</div>`).join('');
  document.getElementById('view').innerHTML = ({
    portfolio:viewPortfolio, site:viewSite, rekomendasi:viewRekomendasi,
    overview:viewOverview, pipeline:viewPipeline, performa:viewPerforma,
    keyword:viewKeyword, banding:viewBanding, meta:viewMeta, strategi:viewStrategi, aksi:viewAksi}[cur])();
  bind();
}

function filtered(){
  return ARTICLES.filter(a=>
    (!F.month || a.month===F.month) &&
    (!F.client || a.client===F.client) &&
    (!F.status || status(a)===F.status) &&
    (!F.q || (a.judul+' '+(a.keyword||'')+' '+(a.client||'')).toLowerCase().includes(F.q.toLowerCase())));
}

/* ---------- 0. Portofolio (beranda) ---------- */
function siteHealth(p){
  if (p.dns === false) return {cls:'p-bad', t:'DOMAIN MATI'};
  if (p.http && p.http >= 400) return {cls:'p-bad', t:'HTTP '+p.http};
  if (!p.gsc_properti) return {cls:'p-warn', t:'TANPA GSC'};
  if (p.sitemap === null && p.dns !== false) return {cls:'p-warn', t:'TANPA SITEMAP'};
  return {cls:'p-ok', t:'SEHAT'};
}
// satu domain = satu sebab (prioritas tertinggi), biar 'perlu perhatian' tidak dobel hitung
function healthCounts(list){
  const c = {mati:0, nogsc:0, nositemap:0, http:0};
  for (const p of list){
    const t = siteHealth(p).t;
    if (t==='DOMAIN MATI') c.mati++;
    else if (t.startsWith('HTTP')) c.http++;
    else if (t==='TANPA GSC') c.nogsc++;
    else if (t==='TANPA SITEMAP') c.nositemap++;
  }
  return c;
}
function viewPortfolio(){
  const list = PORTFOLIO.slice();
  const tot = list.reduce((o,p)=>{o.impr+=p.impr;o.clicks+=p.clicks;o.art+=p.artikel;o.posted+=p.posted;return o;},
    {impr:0,clicks:0,art:0,posted:0});
  const hc = healthCounts(list);
  const bad = hc.mati + hc.http + hc.nogsc + hc.nositemap;
  const ctr = tot.impr ? (100*tot.clicks/tot.impr).toFixed(2) : 0;
  const cards = list.map(p=>{
    const h = siteHealth(p);
    return `<div class="card site" data-dom="${esc(p.domain)}">
      <div class="row1"><b>${esc(p.nama)}</b><span class="pill ${h.cls}">${h.t}</span></div>
      <div class="muted small">${esc(p.domain)}</div>
      <div class="grid k3" style="margin-top:8px">
        <div><div class="lbl">Impresi</div><div class="v">${fmt(p.impr)}</div></div>
        <div><div class="lbl">Klik</div><div class="v">${fmt(p.clicks)}</div></div>
        <div><div class="lbl">CTR</div><div class="v">${dec(p.ctr,2)}%</div></div>
      </div>
      <div class="muted small" style="margin-top:6px">${p.posted}/${p.artikel} artikel posted • ${fmt(p.urls_gsc)} URL di GSC • rank ${dec(p.pos,1)}</div>
      <div style="margin-top:8px"><button class="btn-go" data-dom="${esc(p.domain)}">Lihat detail →</button></div>
    </div>`;
  }).join('');
  return `
  <div class="grid kpi">
    ${kpi('Website aktif', fmt(list.length), 'domain yang dikerjakan')}
    ${kpi('Total impresi', fmt(tot.impr), '90 hari, semua URL')}
    ${kpi('Total klik', fmt(tot.clicks), 'CTR '+ctr+'%')}
    ${kpi('Artikel posted', fmt(tot.posted)+' / '+fmt(ARTICLES.length), 'kertas kerja (yang belum tayang belum punya domain)')}
    ${kpi('Perlu perhatian', fmt(bad), hc.mati+' domain mati • '+hc.nogsc+' tanpa GSC • '+hc.nositemap+' tanpa sitemap')}
  </div>
  <h2>🏠 Portofolio Website <span class="muted small">(urut impresi)</span></h2>
  <div class="grid sites">${cards}</div>`;
}

/* ---------- 0b. Performa Website ---------- */
function viewSite(){
  const dom = F.site || (PORTFOLIO[0] && PORTFOLIO[0].domain);
  if (!dom) return `<div class="card"><p class="muted">Belum ada website.</p></div>`;
  const p = PORTFOLIO.find(x=>x.domain===dom) || {};
  const dp = DOMAIN_PERF[dom] || {top:[],weeks:[],urls:0,impr:0,clicks:0,ctr:0,pos:0};
  const arts = ARTICLES.filter(a=>a.domain===dom);
  const o = agg(arts);
  const wk = dp.weeks || [];
  const top = (dp.top||[]).slice(0,25);
  const rows = top.map(t=>`<tr>
    <td class="small">${esc(t.u.replace(/^https?:\/\/[^/]+/,''))}</td>
    <td>${fmt(t.impr)}</td><td>${fmt(t.clicks)}</td><td>${dec(t.ctr,2)}%</td><td>${dec(t.pos,1)}</td>
    <td>${t.impr>=100&&t.ctr<1.5?'<span class="pill p-warn">CTR rendah</span>':''}
        ${t.pos>10?'<span class="pill p-bad">di luar H1</span>':''}</td></tr>`).join('');
  return `
  <div class="ctl">
    <select id="f-site"><option value="">— pilih website —</option>${
      PORTFOLIO.map(x=>`<option value="${esc(x.domain)}"${x.domain===dom?' selected':''}>${esc(x.nama)}</option>`).join('')}</select>
    <span class="muted small">${esc(dom)} • ${fmt(dp.urls)} URL di GSC</span>
  </div>
  <div class="grid kpi">
    ${kpi('Impresi', fmt(dp.impr), '90 hari')}
    ${kpi('Klik', fmt(dp.clicks), 'CTR '+dec(dp.ctr,2)+'%')}
    ${kpi('Rank rata-rata', dec(dp.pos,1), 'semua URL')}
    ${kpi('Artikel kertas kerja', fmt(o.posted)+' / '+fmt(o.n), 'posted / total')}
    ${kpi('Top 3 / Halaman 1', fmt(o.top3)+' / '+fmt(o.page1), 'dari artikel yang punya metrik')}
  </div>
  <h2>Tren Mingguan</h2>
  <div class="card">${wk.length?bars(wk.map(w=>({l:w.w.slice(4),v:w.impr})),{h:170}):'<p class="muted">Belum ada data mingguan.</p>'}</div>
  <h2>Artikel Teratas di Website Ini <span class="muted small">(semua URL, bukan cuma kertas kerja)</span></h2>
  <div class="card">${table([{k:'u',t:'URL'},{k:'impr',t:'Impresi'},{k:'clicks',t:'Klik'},{k:'ctr',t:'CTR'},{k:'pos',t:'Rank'},{k:'x',t:'Catatan'}], rows)}</div>`;
}

/* ---------- 0c. Rekomendasi (artikel tidak perform / optimasi ulang) ---------- */
function ageDays(a){
  const d = a.deadline_posting || (a.month ? monthKey(a.month)+'-01' : '');
  if (!d) return null;
  const t = Date.parse(d);
  return isNaN(t) ? null : Math.round((Date.now()-t)/86400000);
}
function decayOf(m){
  const w = (m && m.weeks) || [];
  if (w.length < 8) return null;
  const B = w.slice(-4), A = w.slice(-8,-4);
  const sb = B.reduce((s,x)=>s+x.clicks,0), sa = A.reduce((s,x)=>s+x.clicks,0);
  if (sa < 10) return null;                       // sampel terlalu kecil
  return {a:sa, b:sb, pct: Math.round(100*(sb-sa)/sa)};
}
// satu artikel bisa kena beberapa masalah; skor = perkiraan klik yang bisa diselamatkan
function recoList(){
  const out = [];
  for (const a of ARTICLES){
    if (!a.live_url) continue;
    const m = metrics(a);
    const age = ageDays(a);
    const dk = decayOf(m);          // jangan 'dec' -> menimpa fungsi format dec()
    const issues = [];
    let score = 0;
    if (!m || !m.impr){
      issues.push({t:'Tidak ada impresi', why:'URL tidak muncul di GSC — cek indexing/sitemap', w:3});
      score += 40;
    } else {
      if (m.impr >= 100 && m.ctr < 1.5){
        issues.push({t:'CTR rendah', why:`${fmt(m.impr)} impresi tapi CTR ${dec(m.ctr,2)}% — judul/meta tidak menarik`, w:3});
        score += Math.min(60, m.impr/1000);
      }
      if (m.pos > 3 && m.pos <= 10 && m.impr >= 50){
        issues.push({t:'Peluang Top 3', why:`rank ${dec(m.pos,1)} — dorong sedikit, klik naik banyak`, w:2});
        score += Math.min(40, m.impr/2000);
      }
      if (m.pos > 10 && m.impr >= 200){
        issues.push({t:'Di luar halaman 1', why:`rank ${dec(m.pos,1)} dengan ${fmt(m.impr)} impresi — konten perlu diperkuat`, w:2});
        score += Math.min(30, m.impr/3000);
      }
    }
    if (dk && dk.pct <= -30){
      issues.push({t:'Tren menurun', why:`klik turun ${Math.abs(dk.pct)}% (${fmt(dk.a)} → ${fmt(dk.b)} dalam 4 minggu)`, w:3});
      score += Math.min(50, dk.a/50);
    }
    if (age != null && age > 180 && m && m.pos > 10){
      issues.push({t:'Konten tua', why:`${Math.round(age/30)} bulan, rank ${dec(m.pos,1)} — refresh/update`, w:1});
      score += 10;
    }
    if (issues.length) out.push({a, m, age, dk, issues, score: Math.round(score)});
  }
  out.sort((x,y)=>y.score-x.score);
  return out;
}
function viewRekomendasi(){
  const all = recoList();
  const f = all.filter(r=>{
    if (F.site && r.a.domain !== F.site) return false;
    if (F.client && r.a.client !== F.client) return false;
    if (F.q && !((r.a.judul||'')+' '+(r.a.keyword||'')).toLowerCase().includes(F.q.toLowerCase())) return false;
    return true;
  });
  const byType = {};
  for (const r of all) for (const i of r.issues) byType[i.t] = (byType[i.t]||0)+1;

function viewKuota(){
  // hanya bulan berjalan (CUR_KEY), bukan bulan depan
  const show = MONTHS.filter(m=>monthKey(m)===CUR_KEY);
  if (!show.length) return '<p class="muted small">Tidak ada data untuk bulan berjalan ('+CUR_KEY+').</p>';
  const rows = [];
  for (const c of CLIENTS){
    for (const m of show){
      const l = ARTICLES.filter(a=>a.client===c && a.month===m);
      if (!l.length) continue;
      const q = l[0].kuota || l.length;   // kuota = angka blok, fallback jumlah baris
      const done = l.filter(a=>a.live_url).length;
      rows.push({c, m, q, n:l.length, done, gap:q-done});
    }
  }
  if (!rows.length) return '<p class="muted small">Tidak ada kuota tercatat untuk bulan berjalan.</p>';
  rows.sort((a,b)=>b.gap-a.gap);
  return table([{k:'c',t:'Klien'},{k:'m',t:'Bulan'},{k:'q',t:'Kuota'},{k:'done',t:'Posted'},
                {k:'gap',t:'Kurang'},{k:'st',t:'Status'}],
    rows.map(o=>`<tr><td><b>${esc(o.c)}</b></td><td class="small">${esc(o.m)}</td><td>${o.q}</td>
      <td>${o.done}</td><td>${o.gap>0?`<span class="pill p-bad">${o.gap}</span>`:'<span class="pill p-ok">0</span>'}</td>
      <td>${o.gap<=0?'<span class="pill p-ok">Terpenuhi</span>':
        o.done?`<span class="pill p-warn">Kurang ${o.gap}</span>`:'<span class="pill p-bad">Belum mulai</span>'}</td></tr>`).join(''));
}

function viewPenulis(){
  const names = {};
  for (const a of ARTICLES){
    const key = (a.penulis||'').trim().toUpperCase() || '—';
    const o = names[key] = names[key] || {n:0, posted:0, overdue:0, draft:0};
    o.n++; const s = status(a);
    if (s==='Posted') o.posted++; else if (s==='Overdue') o.overdue++; else if (s==='Draft') o.draft++;
  }
  const rows = Object.entries(names).filter(([k])=>k!=='—').sort((a,b)=>b[1].n-a[1].n);
  if (!rows.length) return '<p class="muted small">Kertas kerja tidak mencantumkan penulis.</p>';
  return table([{k:'c',t:'Penulis'},{k:'n',t:'Artikel'},{k:'posted',t:'Posted'},
                {k:'draft',t:'Draft'},{k:'overdue',t:'Overdue'}],
    rows.map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td>${o.n}</td>
      <td><span class="pill p-ok">${o.posted}</span></td><td>${o.draft}</td>
      <td>${o.overdue?`<span class="pill p-bad">${o.overdue}</span>`:'0'}</td></tr>`).join(''));
}

/* ---------- 3b. Keyword & Kanibalisasi ---------- */
// query sampah: operator pencarian, kata tunggal generik, brand sendiri
const NOISE = /^(ya|iya|ok|oke|hai|hi|halo|test|tes|apa|itu|ini|dan|atau|the|a|an)$/i;
function isNoise(q){
  const s = q.trim();
  if (s.length < 4) return true;
  if (/^(site|inurl|intitle|filetype|related):/i.test(s)) return true;
  if (NOISE.test(s)) return true;
  if (/^(https?:|www\.)/i.test(s)) return true;
  return false;
}
function allQueries(){
  // gabung query dari semua URL artikel -> keyword apa yang kita punya posisi
  const map = {};
  for (const a of ARTICLES){
    const m = metrics(a); if (!m || !m.queries) continue;
    for (const q of m.queries){
      if (isNoise(q.q)) continue;
      const k = q.q.toLowerCase();
      const o = map[k] = map[k] || {q:q.q, impr:0, clicks:0, posW:0, urls:[]};
      o.impr += q.impr; o.clicks += q.clicks; o.posW += q.pos * q.impr;
      o.urls.push({url:a.live_url, judul:a.judul, client:a.client, pos:q.pos, impr:q.impr});
    }
  }
  for (const o of Object.values(map)){
    o.pos = o.impr ? +(o.posW/o.impr).toFixed(1) : 0;
    o.ctr = o.impr ? +(100*o.clicks/o.impr).toFixed(2) : 0;
    o.urls.sort((a,b)=>a.pos-b.pos);
  }
  return map;
}

function viewKeyword(){
  if (!Object.keys(GSC).length) return `<div class="card"><h3 style="margin-top:0">Belum ada data keyword</h3>
    <p class="muted">Jalankan <code>python gsc_pull.py --all --days 90</code> lalu <code>python build.py</code>.</p></div>`;
  const Q = allQueries();
  const list = Object.values(Q);
  if (!list.length) return `<div class="card"><p class="muted">Data GSC belum memuat dimensi query. Jalankan ulang <code>gsc_pull.py</code>.</p></div>`;

  // kanibalisasi hanya bermakna dalam satu domain: beda klien = beda SERP
  const kanib = list.map(o=>{
    const byDom = {};

    const clash = Object.entries(byDom).filter(([c,us])=>us.length>1)
                     .sort((a,b)=>b[1].length-a[1].length);
    return clash.length ? {...o, clash} : null;
  }).filter(Boolean).sort((a,b)=>b.clash[0][1].length-a.clash[0][1].length);

    kanib.slice(0,60).map(o=>{
      const [cli, us] = o.clash[0];
      return `<tr><td><b>${esc(o.q)}</b></td>
      <td><span class="pill p-bad">${us.length}</span></td><td>${fmt(o.impr)}</td>
      <td>${dec(us[0].pos,1)}</td>
      <td class="small"><span class="muted">${esc(cli)}</span><br>${us.slice(0,3).map(u=>`<a href="${esc(u.url)}" target="_blank">${esc((u.judul||u.url).slice(0,60))}</a> <span class="muted">(#${dec(u.pos,1)})</span>`).join('<br>')}
      ${us.length>3?`<br><span class="muted">+${us.length-3} lagi</span>`:''}</td></tr>`;
    }).join('')||'<tr><td colspan="5" class="muted">Tidak ada kanibalisasi. 👍</td></tr>')}</div>

  <h2>🎯 Peluang Top 3 — keyword rank 4-10 dengan impresi tinggi</h2>

    peluang.slice(0,80).map(o=>`<tr><td><b>${esc(o.q)}</b></td><td>${fmt(o.impr)}</td><td>${fmt(o.clicks)}</td>

    nolKlik.slice(0,60).map(o=>`<tr><td><b>${esc(o.q)}</b></td><td>${fmt(o.impr)}</td><td>${dec(o.pos,1)}</td>
      <td class="small"><a href="${esc(o.urls[0].url)}" target="_blank">${esc((o.urls[0].judul||'').slice(0,70))}</a></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Tidak ada.</td></tr>')}</div>

  <h2>✅ Sudah Top 3 — pertahankan</h2>

    top.slice(0,60).map(o=>`<tr><td><b>${esc(o.q)}</b></td><td>${fmt(o.impr)}</td><td>${fmt(o.clicks)}</td>
      <td>${dec(o.ctr)}</td><td><span class="pill p-ok">${dec(o.pos,1)}</span></td>
      <td class="small"><a href="${esc(o.urls[0].url)}" target="_blank">${esc((o.urls[0].judul||'').slice(0,70))}</a></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Tidak ada.</td></tr>')}</div>`;
}

/* ---------- 3c. Banding Periode ---------- */
function periodSplit(){
  // kumpulkan semua label minggu yang ada
  const wks = new Set();
  for (const m of Object.values(GSC)) for (const w of (m.weeks||[])) wks.add(w.w);
  const all = [...wks].sort();
  if (all.length < 2) return null;
  const n = Math.min(4, Math.floor(all.length/2));
  return {A: all.slice(-2*n, -n), B: all.slice(-n), all};
}
function periodAgg(list, weeks){
  const set = new Set(weeks);
  const o = {impr:0, clicks:0, posW:0, n:0};
  for (const a of list){
    const m = metrics(a); if (!m || !m.weeks) continue;
    let hit = false;
    for (const w of m.weeks){
      if (!set.has(w.w)) continue;
      hit = true;
      o.impr += w.impr||0; o.clicks += w.clicks||0;
      o.posW += (w.pos||0)*(w.impr||0);
    }
    if (hit) o.n++;
  }
  o.pos = o.impr ? +(o.posW/o.impr).toFixed(1) : 0;
  o.ctr = o.impr ? +(100*o.clicks/o.impr).toFixed(2) : 0;
  return o;
}
function delta(b, a, lowerBetter){
  if (!a) return b ? '<span class="pill p-ok">baru</span>' : '—';
  const d = b - a;
  const pctv = a ? Math.round(100*d/a) : 0;
  const good = lowerBetter ? d < 0 : d > 0;
  const cls = d === 0 ? 'p-dim' : (good ? 'p-ok' : 'p-bad');
  const sign = d > 0 ? '+' : '';
  const val = lowerBetter ? sign+dec(Math.abs(d)<0.05?0:d,1) : sign+fmt(d);
  return `<span class="pill ${cls}">${val}${lowerBetter?'':' ('+sign+pctv+'%)'}</span>`;
}
function viewBanding(){
  const sp = periodSplit();
  if (!sp) return `<div class="card"><p class="muted">Butuh minimal 2 minggu data GSC untuk membandingkan periode.</p></div>`;
  const rows = CLIENTS.map(c=>{
    const l = ARTICLES.filter(a=>a.client===c);
    const A = periodAgg(l, sp.A), B = periodAgg(l, sp.B);
    return {c, A, B};
  }).filter(o=>o.A.n || o.B.n).sort((a,b)=>(b.B.impr-b.A.impr)-(a.B.impr-a.A.impr));

  const totA = periodAgg(ARTICLES, sp.A), totB = periodAgg(ARTICLES, sp.B);
  const fmtW = w => w.length ? w[0]+'…'+w[w.length-1] : '—';

  return `
  <div class="grid kpi">
    ${kpi('Impresi Periode B', fmt(totB.impr), 'vs '+fmt(totA.impr)+' di periode A')}
    ${kpi('Klik Periode B', fmt(totB.clicks), 'vs '+fmt(totA.clicks))}
    ${kpi('CTR Periode B', dec(totB.ctr)+'%', 'vs '+dec(totA.ctr)+'%')}
    ${kpi('Rank Periode B', dec(totB.pos,1), 'vs '+dec(totA.pos,1)+' (kecil = baik)')}
  </div>
  <p class="muted small">Periode A = ${fmtW(sp.A)} • Periode B = ${fmtW(sp.B)} (masing-masing ${sp.A.length} minggu)</p>

  <h2>Per Klien — Periode B vs A</h2>
  ${table([{k:'c',t:'Klien'},{k:'ia',t:'Impresi A'},{k:'ib',t:'Impresi B'},{k:'di',t:'Δ Impresi'},
           {k:'ca',t:'Klik A'},{k:'cb',t:'Klik B'},{k:'dc',t:'Δ Klik'},
           {k:'pa',t:'Rank A'},{k:'pb',t:'Rank B'},{k:'dp',t:'Δ Rank'}],
    rows.map(o=>`<tr><td><b>${esc(o.c)}</b></td>
      <td>${fmt(o.A.impr)}</td><td>${fmt(o.B.impr)}</td><td>${delta(o.B.impr,o.A.impr,false)}</td>
      <td>${fmt(o.A.clicks)}</td><td>${fmt(o.B.clicks)}</td><td>${delta(o.B.clicks,o.A.clicks,false)}</td>
      <td>${dec(o.A.pos,1)}</td><td>${dec(o.B.pos,1)}</td><td>${delta(o.B.pos,o.A.pos,true)}</td></tr>`).join(''))}`;
}

/* ---------- 3c. Perbaikan Meta ---------- */
function metaRows(){
  const out = [];
  for (const [url,v] of Object.entries(META_AUDIT)){
    if (v.error) continue;
    out.push(Object.assign({url}, v));
  }
  out.sort((a,b)=>b.impr-a.impr);
  return out;
}
function viewMeta(){
  const all = metaRows();
  if (!all.length) return `<div class="card"><h3 style="margin-top:0">Belum ada audit meta</h3>
    <p class="muted">Jalankan <code>python meta_audit.py</code> lalu <code>python meta_fix.py</code> dan <code>python build.py</code>.</p></div>`;
  const f = all.filter(a=>
    (!F.client || a.client===F.client) &&
    (!F.q || ((a.judul||'')+' '+(a.keyword||'')+' '+(a.client||'')).toLowerCase().includes(F.q.toLowerCase())));
  const longT = all.filter(a=>a.len_title>60).length;
  const longD = all.filter(a=>a.len_desc>155).length;
  const emptyD = all.filter(a=>!a.desc).length;
  const noKw = all.filter(a=>!a.keyword).length;
  const rows = f.slice(0,300).map(a=>`<tr>
    <td><b>${esc(a.client)}</b><div class="muted small">${esc((a.judul||'').slice(0,70))}</div></td>
    <td>${fmt(a.impr)}</td><td>${dec(a.ctr,2)}%</td><td>${dec(a.pos,1)}</td>
    <td>${a.keyword?`<code>${esc(a.keyword)}</code>`:'<span class="muted">—</span>'}</td>
    <td class="small">${a.issues.map(i=>`<span class="pill p-warn">${esc(i)}</span>`).join(' ')||'<span class="pill p-ok">ok</span>'}</td>
  </tr>
  <tr class="meta-saran"><td colspan="6">
    <div class="muted small">lama (${a.len_title}c): ${esc(a.title||'—')}</div>
    <div class="ok small">saran (${a.saran_title.length}c): ${esc(a.saran_title)}</div>
    <div class="muted small">desc saran (${a.saran_desc.length}c): ${esc(a.saran_desc)}</div>
    <button class="btn-copy" data-t="${esc(a.saran_title)}" data-d="${esc(a.saran_desc)}">Salin title + description</button>
  </td></tr>`).join('');
  return `<div class="grid kpi">
    ${kpi('URL diaudit', fmt(all.length), 'impresi ≥100 & CTR <1,5%')}
    ${kpi('Title kepanjangan', fmt(longT), '>60 karakter, terpotong di SERP')}
    ${kpi('Description kepanjangan', fmt(longD), '>155 karakter')}
    ${kpi('Description kosong', fmt(emptyD), 'belum ada meta description')}
    ${kpi('Tanpa keyword GSC', fmt(noKw), 'belum ada query tercatat')}
  </div>
  <h2>✍️ Perbaikan Meta Title &amp; Description <span class="muted small">(${fmt(f.length)} URL, urut impresi)</span></h2>
  <div class="card"><p class="muted small">Saran dibuat dari aturan panjang + keyword GSC yang sudah terbukti mendatangkan impresi. Klik <b>Salin</b> lalu tempel ke Yoast/RankMath.</p>
  ${table([{k:'client',t:'Artikel'},{k:'impr',t:'Impr'},{k:'ctr',t:'CTR'},{k:'pos',t:'Rank'},
           {k:'keyword',t:'Keyword'},{k:'issues',t:'Masalah'}], rows)}</div>`;
}

/* ---------- 4. Strategi ---------- */
function viewStrategi(){
  const noKw   = ARTICLES.filter(a=>a.live_url && !a.keyword);
  const noCta  = ARTICLES.filter(a=>a.live_url && !/^https?:/.test(a.produk||''));
  const noOut  = ARTICLES.filter(a=>!a.live_url && (a.outline||'').length<40);
  const plan   = ARTICLES.filter(a=>!a.live_url && a.month && monthKey(a.month)>=CUR_KEY)
                         .sort((a,b)=>monthKey(a.month).localeCompare(monthKey(b.month))).slice(0,80);
  const byClient = CLIENTS.map(c=>{
    const l = ARTICLES.filter(a=>a.client===c);
    return {c, n:l.length, kw:l.filter(a=>a.keyword).length, cta:l.filter(a=>/^https?:/.test(a.produk||'')).length};
  }).sort((a,b)=>(a.kw/a.n)-(b.kw/b.n));

  return `
  <div class="grid kpi">
    ${kpi('Artikel tanpa keyword', fmt(noKw.length), 'sudah posting, belum ada target keyword')}
    ${kpi('Artikel tanpa CTA produk', fmt(noCta.length), 'belum link ke halaman produk/layanan')}
    ${kpi('Artikel tanpa outline', fmt(noOut.length), 'belum posting & belum ada angle')}
    ${kpi('Rencana ke depan', fmt(plan.length), 'artikel bulan ini & setelahnya')}
  </div>

  <h2>Prioritas Klien — Kelengkapan SEO</h2>
  ${table([{k:'c',t:'Klien'},{k:'n',t:'Artikel'},{k:'kw',t:'Keyword'},{k:'kwp',t:'% Keyword'},
           {k:'cta',t:'CTA'},{k:'ctap',t:'% CTA'}],
    byClient.map(o=>`<tr><td><b>${esc(o.c)}</b></td><td>${o.n}</td><td>${o.kw}</td>
      <td><span class="pill ${pct(o.kw,o.n)<30?'p-bad':pct(o.kw,o.n)<70?'p-warn':'p-ok'}">${pct(o.kw,o.n)}%</span></td>
      <td>${o.cta}</td><td>${pct(o.cta,o.n)}%</td></tr>`).join(''))}

  <div class="two">
    <div><h2>Artikel Posting Tanpa Keyword</h2>
      <div class="scroll" style="max-height:340px">${noKw.slice(0,120).map(a=>
        `<div class="rec"><h3>${esc(a.judul)}</h3>
         <div class="row muted small">${esc(a.client||'')} • ${esc(a.month||'')} • <a href="${esc(a.live_url)}" target="_blank">live</a></div></div>`).join('')||'<p class="muted">—</p>'}</div></div>
    <div><h2>Artikel Posting Tanpa CTA Produk</h2>
      <div class="scroll" style="max-height:340px">${noCta.slice(0,120).map(a=>
        `<div class="rec"><h3>${esc(a.judul)}</h3>
         <div class="row muted small">${esc(a.client||'')} • ${esc(a.month||'')} • <a href="${esc(a.live_url)}" target="_blank">live</a></div></div>`).join('')||'<p class="muted">—</p>'}</div></div>
  </div>

  <h2>Rencana Konten ke Depan</h2>
  ${table([{k:'month',t:'Bulan'},{k:'client',t:'Klien'},{k:'judul',t:'Judul'},{k:'deadline_posting',t:'Deadline'},
           {k:'outline',t:'Angle / Outline'}],
    plan.map(a=>`<tr><td class="small">${esc(a.month)}</td><td class="small">${esc(a.client||'—')}</td>
      <td>${esc(a.judul)}</td><td class="small">${esc(a.deadline_posting||'—')}</td>
      <td class="small muted">${esc((a.outline||'').slice(0,180))}</td></tr>`).join(''))}`;
}

/* ---------- 5. Aksi ---------- */
function viewAksi(){
  const overdue = ARTICLES.filter(a=>status(a)==='Overdue')
    .sort((a,b)=>(a.deadline_posting||'').localeCompare(b.deadline_posting||''));
  const soon = ARTICLES.filter(a=>status(a)==='Draft' && a.deadline_posting &&
    a.deadline_posting>=TODAY && a.deadline_posting<=addDays(TODAY,7));
  const noKw = ARTICLES.filter(a=>a.live_url && !a.keyword);
  const noCta = ARTICLES.filter(a=>a.live_url && !/^https?:/.test(a.produk||''));
  const lowCtrAll = Object.entries(GSC).map(([u,m])=>({u,m}))
    .filter(x=>x.m.impr>=100 && (x.m.ctr||0)<1.5)
    .sort((a,b)=>b.m.impr-a.m.impr);
  const lowCtr = lowCtrAll.slice(0,40);
  const byUrl = Object.fromEntries(ARTICLES.map(a=>[a.live_url,a]));
  const zeroImpr = ARTICLES.filter(a=>a.live_url && !metrics(a))
    .sort((a,b)=>(b.deadline_posting||'').localeCompare(a.deadline_posting||''));
  const AUD = Object.fromEntries(AUDIT.map(x=>[x.url, x]));
  const sebab = {};
  for (const a of zeroImpr){
    const x = AUD[a.live_url];
    const k = !x ? 'belum diaudit'
      : x.http==='404' ? '404 — halaman hilang'
      : x.http==='ERR' ? 'DNS/site mati (ERR)'
      : x.noindex ? 'noindex'
      : x.in_sitemap==='T' ? '200 tapi TIDAK ada di sitemap'
      : x.in_sitemap==='Y' ? '200 + di sitemap, belum terindeks'
      : '200, sitemap tak terbaca';
    sebab[k] = (sebab[k]||[]); sebab[k].push(a);
  }
  const noKwByClient = CLIENTS.map(c=>({c, n:noKw.filter(a=>a.client===c).length}))
    .filter(o=>o.n).sort((a,b)=>b.n-a.n);
  const noCtaByClient = CLIENTS.map(c=>({c, n:noCta.filter(a=>a.client===c).length}))
    .filter(o=>o.n).sort((a,b)=>b.n-a.n);

  const card = (cls,title,rows) => `<div class="rec ${cls}"><h3>${title}</h3>${rows}</div>`;
  const item = a => `<div class="row">• <b>${esc(a.judul)}</b>
    <span class="muted small">— ${esc(a.client||'')} • deadline ${esc(a.deadline_posting||'—')}</span>
    ${a.live_url?` <a href="${esc(a.live_url)}" target="_blank">live</a>`:''}
    ${a.draft_url?` <a href="${esc(a.draft_url)}" target="_blank">draft</a>`:''}</div>`;

  return `
  <h2>Prioritas Hari Ini</h2>
  ${card('hi','🔴 Overdue — deadline lewat, belum posting ('+overdue.length+')',
    overdue.slice(0,40).map(item).join('')||'<div class="row muted">Tidak ada. 👍</div>')}
  ${card('mid','🟡 Deadline ≤7 hari, masih draft ('+soon.length+')',
    soon.slice(0,40).map(item).join('')||'<div class="row muted">Tidak ada.</div>')}
  ${card('','🔵 Sudah posting tapi belum ada keyword ('+noKw.length+')',
    noKw.slice(0,30).map(item).join('')||'<div class="row muted">Tidak ada.</div>')}
  ${card('','🟣 Sudah posting tapi belum link ke produk/CTA ('+noCta.length+')',
    noCta.slice(0,30).map(item).join('')||'<div class="row muted">Tidak ada.</div>')}
  ${lowCtr.length?card('mid','📉 Impresi tinggi tapi CTR rendah (<1,5%) ('+lowCtrAll.length+') — perbaiki meta title/description',
    lowCtr.map(x=>`<div class="row">• <b>${esc((byUrl[x.u]||{}).judul||x.u)}</b>
      <span class="muted small">— ${fmt(x.m.impr)} impresi, ${fmt(x.m.clicks)} klik, CTR ${dec(x.m.ctr)}%, rank ${x.m.pos?dec(x.m.pos,1):'—'}</span>
      <a href="${esc(x.u)}" target="_blank">live</a></div>`).join('')):''}

  ${card('hi','🚫 Sudah posting tapi NOL impresi di GSC ('+zeroImpr.length+') — dikelompokkan per sebab',
    Object.entries(sebab).sort((a,b)=>b[1].length-a[1].length).map(([k,list])=>
      `<div class="row"><b>${esc(k)} — ${list.length} artikel</b></div>` +
      list.slice(0,6).map(a=>`<div class="row small" style="padding-left:14px">• ${esc(a.judul)}
        <span class="muted">— ${esc(a.client||'')}</span>
        <a href="${esc(a.live_url)}" target="_blank">live</a></div>`).join('') +
      (list.length>6?`<div class="row small muted" style="padding-left:14px">… +${list.length-6} lagi</div>`:'')
    ).join('')||'<div class="row muted">Tidak ada.</div>')}

  <h2>Rencana Aksi — Perbaikan Massal</h2>
  <div class="two">
    <div class="card"><div class="lbl">Isi keyword untuk artikel yang belum punya</div>
      <p class="small muted">${noKw.length} artikel. Prioritas klien:</p>
      ${noKwByClient.slice(0,12).map(o=>`<div class="row small">• <b>${esc(o.c)}</b> — ${o.n} artikel</div>`).join('')}
      <p class="small muted">Cara cepat: buka tab <b>Strategi Konten</b>, ambil judul + referensi, tentukan 1 keyword utama per artikel, tulis ke kolom <code>Keyword</code> di kertas kerja.</p></div>
    <div class="card"><div class="lbl">Tambah CTA produk ke artikel</div>
      <p class="small muted">${noCta.length} artikel. Prioritas klien:</p>
      ${noCtaByClient.slice(0,12).map(o=>`<div class="row small">• <b>${esc(o.c)}</b> — ${o.n} artikel</div>`).join('')}
      <p class="small muted">Cara cepat: kolom <code>Produk</code> di kertas kerja diisi URL halaman layanan/landing page klien yang relevan.</p></div>
  </div>`;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }

/* ===== events ===== */
function bind(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cur=t.dataset.tab;
    history.replaceState(null,'','#'+cur); render();});
  const m=document.getElementById('f-month'), c=document.getElementById('f-client'),
        s=document.getElementById('f-status'), q=document.getElementById('f-q');
  if(m) m.onchange=()=>{F.month=m.value;render();};
  if(c) c.onchange=()=>{F.client=c.value;render();};
  if(s) s.onchange=()=>{F.status=s.value;render();};
  if(q) q.oninput=()=>{F.q=q.value;clearTimeout(window._qt);
        window._qt=setTimeout(()=>{const p=q.selectionStart;render();
          const n=document.getElementById('f-q'); if(n){n.focus();n.setSelectionRange(p,p);}},250);};
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>sortBy(th.dataset.k));
  document.querySelectorAll('.btn-go').forEach(b=>b.onclick=()=>{
    F.site=b.dataset.dom; cur='site'; history.replaceState(null,'','#site'); render();});
  const fs=document.getElementById('f-site');
  if(fs) fs.onchange=()=>{F.site=fs.value;render();};
  document.querySelectorAll('.btn-copy').forEach(b=>b.onclick=()=>{
    const txt='Title: '+b.dataset.t+'\nDescription: '+b.dataset.d;
    const done=()=>{b.textContent='Tersalin';setTimeout(()=>b.textContent='Salin',1400);};
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done,done);
    else {const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
          ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done();}
  });
  const dl = document.getElementById('dl-pipeline');
  if (dl) dl.onclick = () => downloadCsv('pipeline-artikel.csv',
    ['Kategori','Klien','Bulan','Judul','Deadline','Status','Keyword','Draft','Live'],
    filtered().map(a=>({Kategori:'', Klien:a.client||'', Bulan:a.month||'', Judul:a.judul,
      Deadline:a.deadline_posting||'', Status:status(a), Keyword:a.keyword||'',
      Draft:a.draft_url||'', Live:a.live_url||''})));
}
let sortState={};
function sortBy(k){
  sortState[k]=!sortState[k];
  const dir=sortState[k]?1:-1;
  ARTICLES.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(k==='st'){x=status(a);y=status(b);}
    if(k==='links'){x=a.live_url||'';y=b.live_url||'';}
    return (x==null?'':String(x)).localeCompare(String(y==null?'':y))*dir;
  });
  render();
}

/* ===== live refresh (GitHub Pages) ===== */
async function live(){
  if(!(location.protocol==='http:'||location.protocol==='https:')) return;
  try{
    const b='?t='+Date.now();
    const get = (f, dflt) => fetch('data/'+f+b).then(r=>r.ok?r.json():dflt).catch(()=>dflt);
    const [ar, br, gs, au] = await Promise.all([
      get('articles.json', []), get('brands.json', []),
      get('gsc.json', {}), get('unindexed_audit.json', []),
    ]);
    if(Array.isArray(ar)&&ar.length){ ARTICLES.length=0; ARTICLES.push(...ar); }
    if(Array.isArray(br)&&br.length){ BRANDS.length=0; BRANDS.push(...br); }
    if(Array.isArray(au)&&au.length){ AUDIT.length=0; AUDIT.push(...au); }
    Object.keys(GSC).forEach(k=>delete GSC[k]); Object.assign(GSC, gs||{});
    rebuildGscIndex();
    document.getElementById('stamp').textContent =
      'Data terbaru dimuat '+new Date().toLocaleTimeString('id-ID')+' • '+ARTICLES.length+' artikel';
    render();
  }catch(e){ /* data tertanam tetap dipakai */ }
}

rebuildGscIndex();
document.getElementById('stamp').textContent = META.stamp ||
  (ARTICLES.length + ' artikel • ' + CLIENTS.length + ' klien');
render();
live();
</script>
